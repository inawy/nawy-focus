<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48.png?v=6" />
    <link rel="icon" type="image/png" sizes="96x96" href="./icons/icon-96.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-title" content="ناوي فوكاس" />
    <meta
      name="description"
      content="ناوي فوكاس — مؤقت تركيز بسيط ومحلي أولاً ضمن منظومة ناوي للإنتاجية."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ناوي فوكاس · Nawy Focus</title>
    <script>
      /* Keep the selected theme available before React renders. */
      try {
        var m = localStorage.getItem('nawy-focus:themeMode');
        var dark = true;
        if (m === 'light') dark = false;
        else if (m === 'system')
          dark = !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0e0e10' : '#f4f5f7');
      } catch (e) {}

      /*
       * One-time migration from the older client build.
       * Only clear this app's service worker/cache entries; never wipe unrelated
       * PWAs that share the same origin (for example, other GitHub Pages apps).
       * IndexedDB is deliberately untouched, so sessions and preferences survive.
       */
      (function () {
        var TARGET = '0.2.1';
        var KEY = 'nawy-focus:clientVersion';
        try {
          var cur = localStorage.getItem(KEY);
          if (cur === TARGET) return;

          var done = false;
          function finish() {
            if (done) return;
            done = true;
            try { localStorage.setItem(KEY, TARGET); } catch (e) {}
            var url = new URL(window.location.href);
            url.searchParams.set('v', '6');
            window.location.replace(url.toString());
          }

          var path = window.location.pathname;
          var basePath = path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1);
          var tasks = [];

          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) {
                  var scopePath = new URL(reg.scope).pathname;
                  var belongsToThisApp = scopePath === basePath ||
                    (basePath !== '/' && scopePath.startsWith(basePath));
                  return belongsToThisApp ? reg.unregister() : Promise.resolve(false);
                }));
              })
            );
          }

          if (typeof caches !== 'undefined' && caches.keys) {
            tasks.push(
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) {
                  return caches.open(name).then(function (cache) {
                    return cache.keys().then(function (requests) {
                      var appRequests = requests.filter(function (request) {
                        try {
                          var u = new URL(request.url);
                          return u.origin === window.location.origin &&
                            (basePath === '/' || u.pathname.startsWith(basePath));
                        } catch (e) { return false; }
                      });
                      var isAppCache = name.indexOf('nawy-focus-') === 0;
                      if (isAppCache && appRequests.length === requests.length) {
                        return caches.delete(name);
                      }
                      return Promise.all(appRequests.map(function (request) {
                        return cache.delete(request);
                      }));
                    });
                  });
                }));
              })
            );
          }

          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          }

          if (tasks.length) {
            Promise.all(tasks).then(finish).catch(finish);
            window.setTimeout(finish, 2500);
          } else {
            finish();
          }
        } catch (e) {
          try { localStorage.setItem(KEY, TARGET); } catch (e2) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
