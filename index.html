<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48.png?v=6" />
    <link rel="icon" type="image/png" sizes="96x96" href="./icons/icon-96.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="description" content="ناوي فوكاس — مؤقت تركيز بسيط ومحلي أولاً ضمن منظومة ناوي للإنتاجية." />
    <title>ناوي فوكاس · Nawy Focus</title>
    <script>
      /* Theme bootstrap */
      try {
        var m = localStorage.getItem('nawy-focus:themeMode');
        var dark = true;
        if (m === 'light') dark = false;
        else if (m === 'system')
          dark = !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0e0e10' : '#f4f5f7');
      } catch (e) {}

      /*
       * One-time cleanup for the old fullscreen build.
       * Only touch this app's URL scope; never clear unrelated apps' workers/caches.
       * IndexedDB and user session history are intentionally preserved.
       */
      (function () {
        var TARGET = '0.2.1';
        var KEY = 'nawy-focus:clientVersion';
        try {
          var cur = localStorage.getItem(KEY);
          if (cur === TARGET) return;

          var appPath = new URL('./', window.location.href).pathname;
          var done = false;
          function finish() {
            if (done) return;
            done = true;
            try { localStorage.setItem(KEY, TARGET); } catch (e) {}
            if (cur !== TARGET) {
              var url = new URL(window.location.href);
              url.searchParams.set('v', '6');
              window.location.replace(url.href);
            }
          }

          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                var own = regs.filter(function (r) {
                  try {
                    var p = new URL(r.scope).pathname;
                    return p === appPath || p.indexOf(appPath) === 0;
                  } catch (e) { return false; }
                });
                return Promise.all(own.map(function (r) { return r.unregister(); }));
              })
            );
          }

          if (typeof caches !== 'undefined' && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) {
                  return caches.open(key).then(function (cache) {
                    return cache.keys().then(function (requests) {
                      var ownRequests = requests.filter(function (request) {
                        try {
                          var url = new URL(request.url);
                          return url.origin === window.location.origin &&
                            (url.pathname === appPath || url.pathname.indexOf(appPath) === 0);
                        } catch (e) { return false; }
                      });
                      return Promise.all(ownRequests.map(function (request) {
                        return cache.delete(request);
                      })).then(function () {
                        // Delete only clearly app-owned caches, and only when all
                        // their original entries belonged to this app's URL scope.
                        var allWereOwn = requests.length > 0 && ownRequests.length === requests.length;
                        if (key.indexOf('nawy-focus-') === 0 && allWereOwn) {
                          return caches.delete(key);
                        }
                        return false;
                      });
                    });
                  });
                }));
              })
            );
          }

          try {
            if (document.fullscreenElement && document.exitFullscreen) {
              document.exitFullscreen();
            }
          } catch (e) {}

          if (tasks.length) {
            Promise.all(tasks).then(finish).catch(finish);
            setTimeout(finish, 2500);
          } else {
            finish();
          }
        } catch (e) {
          try { localStorage.setItem(KEY, TARGET); } catch (e2) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
