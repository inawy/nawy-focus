<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48.png?v=4" />
    <link rel="icon" type="image/png" sizes="96x96" href="./icons/icon-96.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-title" content="ناوي فوكاس" />
    <meta
      name="description"
      content="ناوي فوكاس — مؤقت تركيز بسيط ومحلي أولاً ضمن منظومة ناوي للإنتاجية."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ناوي فوكاس · Nawy Focus</title>
    <script>
      try {
        var m = localStorage.getItem('nawy-focus:themeMode');
        var dark = true;
        if (m === 'light') dark = false;
        else if (m === 'system')
          dark = !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0e0e10' : '#f4f5f7');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
